<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Pequeña Página</title>
    <style>
        /* Estilos generales para darle un aspecto moderno */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Tarjeta central */
        .card {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            color: #4a5568;
            margin-bottom: 10px;
        }

        p {
            color: #718096;
            font-size: 16px;
            margin-bottom: 25px;
        }

        /* Botón interactivo */
        .btn {
            background-color: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn:hover {
            background-color: #5a67d8;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>¡Hola! 👋</h1>
        <p>Esta es una página web pequeña creada especialmente para ti. Es limpia, moderna y fácil de personalizar.</p>
        <button class="btn" onclick="saludar()">¡Haz clic aquí!</button>
    </div>

    <script>
        // Un pequeño toque de JavaScript para que sea interactiva
        function saludar() {
            alert("¡Gracias por visitar esta página! 🚀");
        }
    </script>

</body>
</html>
